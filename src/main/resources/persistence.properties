
# Spring AOP.
spring.aop=false
spring.aop.auto=false

# Persistence configuration.
org.coldis.configuration.persistence-enabled=true
org.coldis.configuration.persistence-keyvalue-enabled=true
org.coldis.configuration.persistence.jpa.base-package=lorem.ipsum

# History.
org.coldis.library.persistence.history.history-producer.core-size=1

# Data source default configuration.
spring.datasource.platform=postgresql
spring.datasource.initialization-mode=always
spring.datasource.remove-abandoned=true
spring.datasource.remove-abandoned-timeout=60
spring.datasource.test-while-idle=true
spring.datasource.type=com.zaxxer.hikari.HikariDataSource
spring.datasource.hikari.connection-test-query=SELECT 1
spring.datasource.hikari.minimum-idle=10
spring.datasource.hikari.maximum-pool-size=30
spring.datasource.hikari.connection-init-sql=${spring.datasource.hikari.connection-test-query}
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.leak-detection-threshold=60000
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.idle-timeout=60000
spring.datasource.hikari.max-lifetime=1800000
# PostgreSQL startup options of every pool's connections: the primary's here, each secondary's in
# SecondaryDatasourcesRegistrar unless its own hikari.data-source-properties.options are set. JIT
# compilation is off: it pays off for long CPU-bound queries over millions of rows, while a
# transactional service's short index lookups pay the compilation (hundreds of milliseconds, on
# every execution) whenever the planner overestimates their rows. A method that benefits turns it on
# for its own statements: @QuerySettings(settings = @QuerySetting(name = "jit", value = "on")).
# The primary pool is assumed to be PostgreSQL (the option is PostgreSQL's driver property); a
# service on another database overrides spring.datasource.hikari.data-source-properties.options.
org.coldis.configuration.persistence.connection-options=-c jit=off
spring.datasource.hikari.data-source-properties.options=${org.coldis.configuration.persistence.connection-options}

# JPA configuration.
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.jakarta.persistence.query.timeout=300000
spring.jpa.properties.hibernate.jdbc.batch_size=0
#spring.jpa.properties.hibernate.hbm2ddl.import_files_sql_extractor=org.hibernate.tool.hbm2ddl.MultipleLinesSqlCommandExtractor
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

